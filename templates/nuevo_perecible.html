{% extends "base.html" %}

{% block titulo %}Nuevo Producto Perecible{% endblock %}

{% block content %}

<a href="{{ url_for('inicio') }}"
   class="btn btn-outline-secondary mb-3">
    ← Volver al catálogo
</a>

<div class="card">
    <div class="card-body">

        <h2 class="mb-4">
            🍓 Nuevo Producto Perecible
        </h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">
                    Código
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="codigo"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="nombre"
                    required
                >
            </div>


            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Precio base ($)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        class="form-control"
                        name="precio_base"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Stock inicial
                    </label>

                    <input
                        type="number"
                        min="0"
                        class="form-control"
                        name="stock"
                        required
                    >
                </div>

            </div>


            <div class="mb-3">
                <label class="form-label">
                    Días para vencer
                </label>

                <input
                    type="number"
                    min="0"
                    class="form-control"
                    name="dias_para_vencer"
                    required
                >

                <div class="form-text">
                    Ingresa cuántos días faltan para que venza el producto.
                </div>
            </div>


            <!-- IMAGEN DEL PRODUCTO -->
            <div class="mb-3">

                <label class="form-label">
                    📸 Imagen del producto
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="imagen"
                    accept=".png,.jpg,.jpeg,.webp"
                >

                <div class="form-text">
                    Formatos permitidos: PNG, JPG, JPEG o WEBP.
                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Crear producto
            </button>

        </form>

    </div>
</div>

{% endblock %}
